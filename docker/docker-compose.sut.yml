# System under test: Restful Booker Platform (RBP) by Mark Winteringham
# https://github.com/mwinteringham/restful-booker-platform (GPL-3.0)
#
# Deployment configuration only: it references the images that RBP's own CI publishes
# to Docker Hub. No RBP code lives in this repository.
#
# Images are pinned by digest (tags are mutable). These digests are the `latest` tag as
# published on 2026-11-26, built from RBP commit 2069ba1c ("routing-improvements").
# They are linux/amd64 only: native in CI, emulated (Rosetta) on Apple Silicon.

name: rbp

# Shared readiness settings for the Spring Boot services (generous for emulated amd64).
x-java-healthcheck: &java-healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 30s

x-amd64: &amd64
  platform: linux/amd64

services:
  # Service names are part of the contract: the assets (front-end) image has the
  # backend URLs baked in as http://rbp-<service>:<port>.

  rbp-booking:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_booking@sha256:d77762ef5d592a191dd74df792d0c51ad9a3899ebf6afe0eac5d19ed2108f0a2
    ports: ["3000:3000"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/booking/actuator/health"]

  rbp-room:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_room@sha256:6bf7f8ada7ee991f43911dd0a0f8eb217a262369599cd64316a49975d4a80a08
    ports: ["3001:3001"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/room/actuator/health"]

  rbp-branding:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_branding@sha256:ef4ded3aa8f75cc3473481090e0097f425c9924b6820859d4a00c0d45ef91f67
    ports: ["3002:3002"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/branding/actuator/health"]

  rbp-auth:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_auth@sha256:45a0931209a101c35da9af777d87bdf2a57115a82e033fa024889086a24dc058
    ports: ["3004:3004"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/auth/actuator/health"]

  rbp-report:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_report@sha256:0c54160a5d2ef8957629d884b438f57bf60f7df49a41be2a2b789a280022e645
    ports: ["3005:3005"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/report/actuator/health"]

  rbp-message:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_message@sha256:57d16211a91c6c63bca970eb52aa65c5c46d77591e16abb0ec5aaaa110090fea
    ports: ["3006:3006"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/message/actuator/health"]

  rbp-assets:
    <<: *amd64
    image: mwinteringham/restfulbookerplatform_assets@sha256:e9eae7a072982db077f83237268599c72d9e732ec67125be095345d90487965b
    ports: ["80:3003"]  # the front end listens on 3003 inside the container
    depends_on:
      rbp-booking: { condition: service_healthy }
      rbp-room: { condition: service_healthy }
      rbp-branding: { condition: service_healthy }
      rbp-auth: { condition: service_healthy }
      rbp-report: { condition: service_healthy }
      rbp-message: { condition: service_healthy }
    healthcheck:
      # Node 24 image: no curl/wget needed. Next.js listens on IPv4 only (HOSTNAME=0.0.0.0).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
