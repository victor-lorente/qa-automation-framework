[pytest]
# Only collect tests from tests/ (never from .sut/ or .venv/).
testpaths = tests

# pytest-bdd resolves scenarios("login/admin_login.feature") relative to this folder.
bdd_features_base_dir = features/

# --strict-markers: an unregistered or misspelled marker/Gherkin tag fails the run
#                   instead of silently selecting nothing with -m.
# -ra:              short summary of every non-passed test (skips show their reason,
#                   e.g. why a mutating test was skipped in remote).
# --html:           pytest-html report; --self-contained-html embeds CSS/images in one file.
addopts =
    --strict-markers
    -ra
    --html=reports/report.html
    --self-contained-html

# Capture INFO logs, so a failing test shows the requests it sent (e.g. "POST /api/auth/login")
# under "Captured log" in the console and in the HTML report.
log_level = INFO

# pytest-html: show these environment-table entries with their values hidden,
# so credentials never end up in reports/report.html.
environment_table_redact_list =
    (?i).*password.*
    (?i).*token.*
    (?i).*secret.*

# Every Gherkin tag becomes a pytest marker, so all tags must be registered here.
# Per-scenario ID tags (@QA-<n>) are registered dynamically in conftest.py.
markers =
    api: tests that exercise the HTTP API only
    ui: tests that drive the browser UI only
    hybrid: tests that combine API (setup/verification) and UI
    infrastructure: service health and availability checks
    login: admin authentication scenarios
    validation: functional checks for rooms, bookings and messages
    mutating: creates, updates or deletes data; skipped automatically when ENV=remote
    local_only: needs the local Docker SUT; skipped when ENV=remote
    smoke: small, fast subset to check the system is basically working
    accessibility: automated accessibility checks
    # Known SUT bugs: every marker starting with "bug_" turns the test into xfail(strict=True)
    # with the text below as reason (see conftest.py). If RBP fixes the bug, the test XPASSes,
    # which fails the run on purpose: remove the tag then.
    bug_deleted_room_500: KNOWN RBP BUG - GET /api/room/{id} of a deleted room returns 500 instead of 404 (RBP 2069ba1c)
